<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <main>
      <h1>Register</h1>

      <form id="register-form">
        <div>
          <label for="name">Username</label>
          <input
            type="text"
            id="name"
            name="name"
            required
          />
        </div>

        <div>
          <label for="email">Noroff email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
          />
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
          />
        </div>

        <button type="submit">Register</button>
      </form>

      <p id="message"></p>

      <p>
        Already have an account?
        <a href="./login.html">Login</a>
      </p>
    </main>

    <script
      type="module"
      src="./js/auth/register.js"
    ></script>
  </body>
</html>

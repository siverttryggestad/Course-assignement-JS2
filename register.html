<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <main class="container my-5">
      <h1 class="card-title mb-4">Register</h1>
      <div class="card mx-auto register-card">
        <div class="card-body">

        <form id="register-form">
         <div class ="mb-3">
           <label for="name" class="form-label">Username</label>
           <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Noroff email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            class="form-control"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
      </form>

      <p id="message" class="mt-3"></p>

      <p class="mt-3 mb-0">
        Already have an account?
        <a href="./login.html">Login</a>
      </p>
    </main>

    <script
      type="module"
      src="./js/auth/register.js"
    ></script>
  </body>
</html>
